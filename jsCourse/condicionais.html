<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran</title>
    <link rel="stylesheet" href="condicionais.js">
    <style>
        div#res{
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>Sistema de Multas</h1> 
    Velocidade do carro <input type="number" name="txtvel" id="txtvel"> <Km>
    <h><input type="button" value="Verificar" onclick="calcular()"></h>
    <div id="res">

    </div>
    <script>
        function calcular(){
            var txtv = window.document.querySelector('input#txtvel')
            var res = window.document.querySelector('div#res')

            var vel = Number(txtvel.value)
            res.innerHTML = `Sua velocidade atual é de ${vel} Km/h.`
            if(vel > 80){
                res.innerHTML += ` Sua velocidade esta acima do permitido, você esta MULTADO! Use sempre cinto de segurança!`
            } else {
                res.innerHTML += `Use sempre cinto de segurança!`

            }
        }
    </script>
</body>
</html>
