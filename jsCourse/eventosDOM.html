<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstudisJS</title>
    <style>
        div#area{
            font: normal 20pt Arial;
            background: #9bc6de;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
            border-radius: 1cap;
            }
    </style>
</head>
<body>
    <!--<div id="area"  onclick="clicar()" onmouseenter="entrar()" onmouseleave="sair()" </onclick>>-->
    <div id = "area">
        Interaja...
    </div>
    <script>

        var a = window.document.getElementById('area')
        a.addEventListener('click', clicar)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseleave', sair)

        function clicar(){
            //var a = window.document.getElementById('area')
            a.innerText = 'Clicou!'
            a.style.background = 'red'
        }
        function entrar(){
            //var e = window.document.getElementById('area')
            a.innerText = 'Entrou'
            a.style.background = 'purple'
        }
        function sair(){
            //var s = window.document.getElementById('area')
            a.innerText = 'Saiu'
            a.style.background = 'green'
        }
        

    </script>
</body>
</html>
